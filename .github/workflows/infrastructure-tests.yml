name: Infrastructure Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout quant-infrastructure
        uses: actions/checkout@v4

      # The Spark service bind-mounts ../quant-platform. Create an empty directory
      # so docker compose does not fail when the sibling repo is not checked out.
      - name: Create quant-platform placeholder
        run: mkdir -p ../quant-platform

      - name: Generate .env from example
        run: |
          # CI uses the example defaults as-is — these are throwaway credentials
          # for an ephemeral stack that is torn down at the end of the run, so no
          # repository secrets are required.
          cp .env.example .env
          # A valid Fernet key is required for Airflow to boot — the placeholder
          # in .env.example is not a real key. Generate one with the stdlib only
          # (32 random bytes, url-safe base64) to avoid a cryptography dependency.
          FERNET_KEY=$(python3 -c "import os, base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          sed -i "s|changeme_generate_with_fernet|${FERNET_KEY}|" .env
          # Discover docker group GID on the runner
          echo "DOCKER_GID=$(getent group docker | cut -d: -f3)" >> .env

      - name: Start stack and wait for healthy
        run: docker compose up --build -d --wait
        timeout-minutes: 15

      - name: Layer 1 — Smoke tests
        run: bash tests/smoke_tests.sh

      - name: Layer 2 — PySpark integration tests
        run: |
          docker exec quant-jupyter-spark \
            python -m pytest /home/jovyan/infra-tests/ -v --tb=short

      - name: Layer 3 — Airflow → Spark DAG test
        run: bash tests/run_integration_tests.sh --no-up --no-down

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color > /tmp/compose-logs.txt 2>&1

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/compose-logs.txt
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose down -v
