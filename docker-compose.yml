services:
  spark:
    build: ./spark
    container_name: qt_spark
    ports:
      - "8888:8888"
    volumes:
      - ../qt_data:/home/jovyan/work
    environment:
      PYSPARK_SUBMIT_ARGS: "--packages io.delta:delta-core_2.12:2.4.0,org.apache.hadoop:hadoop-aws:3.3.2 pyspark-shell"
    depends_on:
      - minio

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    container_name: qt_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"