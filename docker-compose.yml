services:
  spark:
    build: ./spark
    container_name: qt_spark
    ports:
      - "8888:8888"
    volumes:
      - ../qt_data:/home/jovyan/work # map the scripts root dir to the container as a volume to persist scripts changes
    environment:
      PYSPARK_SUBMIT_ARGS: "--repositories https://packages.databricks.com/repo/ 
                            --packages io.delta:delta-core_2.12:2.4.0,\
                                       org.apache.hadoop:hadoop-aws:3.3.2,\
                                       org.postgresql:postgresql:42.7.3 
                            pyspark-shell"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY} # apikey to extract stock data

  db:
    image: postgres:16
    container_name: qt_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data